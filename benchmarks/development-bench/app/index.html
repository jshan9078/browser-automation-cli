<!doctype html><html><head><meta charset="utf-8"><title>Acme Console</title>
<style>
body{margin:0;font-family:system-ui;color:#1f2937}.app{display:flex;min-height:100vh}.side{width:220px;background:#111827;color:#e5e7eb;padding:16px}.side a{display:block;color:#e5e7eb;text-decoration:none;padding:8px;border-radius:6px}.side a.active{background:#374151}
.main{flex:1;padding:24px;max-width:900px}.btn{padding:8px 14px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left}.badge{padding:2px 8px;border-radius:10px;font-size:12px;background:#dcfce7}.badge.archived{background:#fee2e2}
label{display:block;margin:10px 0 4px}input,select{padding:7px;border:1px solid #d1d5db;border-radius:6px;min-width:260px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}.modal>div{background:#fff;padding:20px;border-radius:8px;min-width:320px}
.toast{position:fixed;top:12px;right:12px;background:#111827;color:#fff;padding:10px 14px;border-radius:6px}.hidden{display:none}.sug{border:1px solid #d1d5db;border-top:0;max-width:260px}.sug div{padding:6px;cursor:pointer}.sug div:hover{background:#eff6ff}.row{display:flex;gap:8px;align-items:center}
.skel{height:14px;background:#e5e7eb;border-radius:4px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}
</style></head><body>
<div id="root"></div>
<script src="/hard.js"></script>
<script>
const $=s=>document.querySelector(s);const api=(p,o={})=>fetch(p,{headers:{'Content-Type':'application/json'},...o}).then(async r=>({ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))}));
let route=location.hash.slice(1)||'/dashboard', me=null, toastT;
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=m;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),4000);}
function nav(r){location.hash=r;}
window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'/dashboard';render();});
async function render(){
  const r=await api('/api/me'); me=r.ok?r.data:null;
  if(!me) return renderLogin();
  const root=$('#root');
  root.innerHTML=`<div class="app"><nav class="side" aria-label="Main"><div style="font-weight:700;margin-bottom:12px">Acme Console</div>
   <a href="#/dashboard" class="${route==='/dashboard'?'active':''}">Dashboard</a><a href="#/projects" class="${route.startsWith('/projects')?'active':''}">Projects</a><a href="#/settings" class="${route==='/settings'?'active':''}">Settings</a><a href="#/status">Status</a><a href="#/members">Members</a><a href="#/flags">Feature flags</a><a href="#/priorities">Priorities</a><a href="#/schedule">Maintenance</a><a href="#/billing">Billing</a><a href="#/audit">Audit log</a><a href="#/support">Support</a></nav>
   <div class="main" id="main"></div></div>`;
  if(route==='/dashboard') renderDash(); else if(route==='/projects') renderProjects(); else if(route==='/projects/new') renderWizard(); else if(route==='/settings') renderSettings(); else if(HARD[route]) HARD[route]($('#main')); else $('#main').innerHTML=`<h1>${route.slice(1)}</h1><p>Nothing here yet.</p>`;
}
function renderLogin(){$('#root').innerHTML=`<div class="main" style="margin:80px auto"><h1>Sign in to Acme Console</h1><form id="login"><label for="u">Username</label><input id="u" name="username" autocomplete="username"><label for="p">Password</label><input id="p" name="password" type="password"><div id="err" role="alert" style="color:#b91c1c;margin:8px 0"></div><button class="btn primary" type="submit">Sign in</button></form><p><a href="#/forgot">Forgot password?</a></p></div>`;
  $('#login').onsubmit=async e=>{e.preventDefault();const r=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#u').value,password:$('#p').value})});if(r.ok){render();}else $('#err').textContent=r.data.error;};}
function renderDash(){$('#main').innerHTML=`<h1>Dashboard</h1><div class="row"><div class="skel" style="width:120px"></div></div><div id="d"></div>`;
  setTimeout(()=>{$('#d').innerHTML=`<h2>Account</h2><p>Signed in as <strong id="email">${me.email}</strong> · Plan: <span id="plan">${me.plan}</span></p><h2>Quick actions</h2><button class="btn" onclick="nav('/projects/new')">New project</button> <button class="btn" onclick="toast('Synced')">Sync now</button>`;},600);}
let pq='',ppage=1;
async function renderProjects(){const m=$('#main');m.innerHTML=`<h1>Projects</h1><div class="row"><input id="q" placeholder="Search projects" value="${pq}" aria-label="Search projects"><button class="btn" id="search">Search</button><button class="btn primary" onclick="nav('/projects/new')">New project</button></div><div id="tbl"><div class="skel"></div></div>`;
  $('#search').onclick=()=>{pq=$('#q').value;ppage=1;loadProjects();};$('#q').onkeydown=e=>{if(e.key==='Enter'){pq=$('#q').value;ppage=1;loadProjects();}};loadProjects();}
async function loadProjects(){const r=await api(`/api/projects?q=${encodeURIComponent(pq)}&page=${ppage}`);const d=r.data;
  $('#tbl').innerHTML=`<table><thead><tr><th>Name</th><th>Hostname</th><th>Mode</th><th>Status</th><th>Owner</th><th></th></tr></thead><tbody>${d.items.map(p=>`<tr data-id="${p.id}"><td><span class="pname">${p.name}</span> <button class="btn" style="padding:2px 6px" data-rename="${p.id}" aria-label="Rename ${p.name}">✎</button></td><td>${p.hostname}</td><td>${p.mode}</td><td><span class="badge ${p.status}">${p.status}</span></td><td>${p.owner}</td><td>${p.status==='active'?`<button class="btn" data-archive="${p.id}" aria-label="Archive ${p.name}">Archive</button>`:`<button class="btn" data-restore="${p.id}" aria-label="Restore ${p.name}">Restore</button>`}</td></tr>`).join('')}</tbody></table>
  <div class="row" style="margin-top:10px"><button class="btn" id="prev" ${d.page<=1?'disabled':''}>Previous</button><span>Page ${d.page} of ${d.pages} · ${d.total} projects</span><button class="btn" id="next" ${d.page>=d.pages?'disabled':''}>Next</button></div>`;
  $('#prev').onclick=()=>{ppage--;loadProjects();};$('#next').onclick=()=>{ppage++;loadProjects();};
  document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>confirmArchive(+b.dataset.archive,b.getAttribute('aria-label').slice(8)));
  document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{await api(`/api/projects/${b.dataset.restore}/restore`,{method:'POST',body:'{}'});toast('Project restored');loadProjects();});
  document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{const tr=b.closest('tr'),span=tr.querySelector('.pname');const cur=span.textContent;tr.children[0].innerHTML=`<input id="rename" value="${cur}" aria-label="Project name"> <button class="btn" id="save-name">Save</button>`;$('#save-name').onclick=async()=>{await api(`/api/projects/${b.dataset.rename}`,{method:'POST',body:JSON.stringify({name:$('#rename').value})});toast('Renamed');loadProjects();};});}
function confirmArchive(id,name){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div role="dialog" aria-label="Archive project"><h2>Archive ${name}?</h2><p>The project will stop serving traffic. You can restore it later.</p><div class="row"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="confirm">Archive</button></div></div>`;document.body.appendChild(m);
  $('#cancel').onclick=()=>m.remove();$('#confirm').onclick=async()=>{await api(`/api/projects/${id}/archive`,{method:'POST',body:'{}'});m.remove();toast('Project archived');loadProjects();};}
function renderWizard(){let step=1,data={name:'',hostname:'',mode:'managed'};const m=$('#main');
  const draw=()=>{if(step===1){m.innerHTML=`<h1>New project</h1><p>Step 1 of 2 — Basics</p><label for="name">Project name</label><input id="name" value="${data.name}"><label for="host">Hostname</label><input id="host" role="combobox" aria-autocomplete="list" aria-expanded="false" value="${data.hostname}" placeholder="Start typing a domain"><div id="sug" class="sug hidden"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="nav('/projects')">Cancel</button><button class="btn primary" id="next">Continue</button></div>`;
      const host=$('#host');host.oninput=()=>{const v=host.value;const s=$('#sug');if(v.length<2){s.classList.add('hidden');return;}const opts=['example','acme-internal','zera'].map(d=>`${v.split('.')[0]}.${d}.com`).concat([`${v}`]);s.innerHTML=opts.map(o=>`<div role="option">${o}</div>`).join('');s.classList.remove('hidden');host.setAttribute('aria-expanded','true');s.querySelectorAll('div').forEach(o=>o.onclick=()=>{host.value=o.textContent;s.classList.add('hidden');});};
      $('#next').onclick=()=>{data.name=$('#name').value.trim();data.hostname=$('#host').value.trim();if(!data.name||!data.hostname){toast('Name and hostname are required');return;}step=2;draw();};}
    else{m.innerHTML=`<h1>New project</h1><p>Step 2 of 2 — Mode</p><p>Project <strong>${data.name}</strong> on <strong>${data.hostname}</strong></p><label for="mode">Widget mode</label><select id="mode"><option value="managed">Managed</option><option value="non-interactive">Non-interactive</option><option value="invisible">Invisible</option></select><div class="row" style="margin-top:14px"><button class="btn" id="back">Back</button><button class="btn primary" id="create">Create project</button></div>`;
      $('#mode').value=data.mode;$('#back').onclick=()=>{data.mode=$('#mode').value;step=1;draw();};$('#create').onclick=async()=>{data.mode=$('#mode').value;const r=await api('/api/projects',{method:'POST',body:JSON.stringify(data)});if(r.ok){toast('Project created');nav('/projects');}};}};draw();}
async function renderSettings(){const s=(await api('/api/settings')).data;$('#main').innerHTML=`<h1>Settings</h1><form id="sf"><label for="dn">Display name</label><input id="dn" value="${s.display_name}"><label for="tz">Timezone</label><select id="tz">${['UTC','America/New_York','America/Los_Angeles','Europe/London','Europe/Berlin','Asia/Tokyo'].map(z=>`<option ${z===s.timezone?'selected':''}>${z}</option>`).join('')}</select>
  <label><input type="checkbox" id="digest" ${s.digest?'checked':''}> Weekly digest email</label><label><input type="checkbox" id="alerts" ${s.alerts?'checked':''}> Incident alerts</label><div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Save changes</button><button class="btn" type="button" onclick="renderSettings()">Reset</button></div></form>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();if($('#dn').value.length>20){toast('Display name must be 20 characters or fewer');return;}await api('/api/settings',{method:'POST',body:JSON.stringify({display_name:$('#dn').value,timezone:$('#tz').value,digest:$('#digest').checked,alerts:$('#alerts').checked})});toast('Settings saved');};}
(async function poll(){while(true){try{await fetch('/poll');}catch(e){}}})();
render();
</script></body></html>
