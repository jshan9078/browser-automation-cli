name: rust-wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["rust/**", "tests/**", "scratch/bench/site/**", ".github/workflows/rust-wheels.yml"]
  pull_request:
    paths: ["rust/**", "tests/**", ".github/workflows/rust-wheels.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux validation: the Python end-to-end suite driven against the Rust daemon + Rust client.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v4
      - name: Build
        run: cd rust && cargo build --release
      - name: Python deps (test runner only) + system libs for Chromium
        run: |
          uv sync
          uv run playwright install-deps chromium
      - name: Native browser install (validates the Rust installer on Linux)
        run: rust/target/release/browser install
      - name: End-to-end tests on the Rust daemon
        env:
          BROWSER_CLI: ${{ github.workspace }}/rust/target/release/browser
          BROWSER_DAEMON: ${{ github.workspace }}/rust/target/release/browser-daemon
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python -m unittest -v tests/test_cli.py
      - name: End-to-end tests again with engine=system (the runner's installed Chrome)
        env:
          BROWSER_CLI: ${{ github.workspace }}/rust/target/release/browser
          BROWSER_DAEMON: ${{ github.workspace }}/rust/target/release/browser-daemon
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rust/target/release/browser engine system
          uv run python -m unittest tests/test_cli.py
          rust/target/release/browser engine auto
      - name: Daemon log on failure
        if: failure()
        run: cat /tmp/test-daemon.log || true

  wheels:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }  # native: ring/rustls does not cross-compile in the cross-gcc image
          - { os: macos-14, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync the package README (PyPI description) from the repo README
        run: cp README.md SKILL.md rust/
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist
      - name: Smoke the client binary (every matrix entry builds natively)
        run: |
          set -e
          pip install rust/dist/*.whl
          browser --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: rust/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp README.md SKILL.md rust/
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: rust/dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tarballs for install.sh (binaries extracted from each wheel)
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          for w in dist/*.whl; do
            case "$w" in *linux*x86_64*) t="linux-x86_64" ;; *linux*aarch64*) t="linux-aarch64" ;; *macosx*arm64*) t="darwin-arm64" ;; *macosx*x86_64*) t="darwin-x86_64" ;; *) continue ;; esac
            rm -rf tmpw && mkdir tmpw && unzip -q "$w" -d tmpw
            bin=$(find tmpw -type d -name scripts | head -1)
            chmod +x "$bin"/browser "$bin"/browser-daemon
            tar -C "$bin" -czf "dist/browser-cli-$V-$t.tar.gz" browser browser-daemon
            (cd dist && shasum -a 256 "browser-cli-$V-$t.tar.gz" > "browser-cli-$V-$t.sha256")
          done
          rm -rf tmpw; ls -la dist
      - name: Attach wheels and tarballs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "See OPTIMIZATION.md and AGENTBENCH.md for measurements." --generate-notes
          gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "${{ github.repository }}"
      - name: Publish to PyPI (only when the PYPI_API_TOKEN secret is set; same project name as the Python package)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then echo "PYPI_API_TOKEN not set; skipping PyPI publish"; exit 0; fi
          pip install uv
          uv publish dist/browser_automation_cli-*
