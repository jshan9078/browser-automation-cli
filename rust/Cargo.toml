[package]
name = "browser-cli"
version = "0.5.0"
edition = "2021"
description = "Browser automation daemon + CLI for coding agents. Persistent sessions, no MCP, no extensions."
license = "MIT"

[lib]
name = "browser_cli"
path = "src/lib.rs"

[[bin]]
name = "browser"
path = "src/main.rs"

[[bin]]
name = "browser-daemon"
path = "src/daemon_main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
